name: Business Invariants

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      frequency:
        description: Execution frequency filter
        required: false
        default: ""
        type: choice
        options:
          - ""
          - on_every_commit
          - on_pull_request
          - nightly
          - weekly
          - before_release
          - after_migration
          - after_ai_patch

jobs:
  invariants:
    name: Business Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_ALGORITHM: HS256
      JWT_SECRET: ${{ secrets.OPERION_JWT_SECRET_KEY || 'test-key-ci-32-chars-required-here!!' }}
      OPERION_JWT_SECRET_KEY: ${{ secrets.OPERION_JWT_SECRET_KEY || 'test-key-ci-32-chars-required-here!!' }}
      OPERION_ENV: test
      BF_ENABLED: "true"
      BF_MAX_ATTEMPTS: "5"
      BF_WINDOW_MINUTES: "5"
      BF_LOCKOUT_MINUTES: "15"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine execution frequency
        id: freq
        run: |
          if [ -n "${{ github.event.inputs.frequency }}" ]; then
            echo "freq=${{ github.event.inputs.frequency }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "freq=nightly"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "freq=on_pull_request"
          else
            echo "freq=on_every_commit"
          fi
        shell: bash

      - name: Run business invariants
        id: invariants_run
        run: |
          FREQ="${{ steps.freq.outputs.freq }}"
          if [ -n "$FREQ" ]; then
            python -m business_invariants run --frequency "$FREQ" --json > invariants-report.json 2>&1
          else
            python -m business_invariants run --json > invariants-report.json 2>&1
          fi
          cat invariants-report.json
        shell: bash

      - name: Parse and report results
        id: parse
        run: |
          python scripts/parse_invariant_report.py invariants-report.json
        shell: bash
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/step-summary.md

      - name: Upload invariant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-report-${{ github.sha }}
          path: invariants-report.json
          retention-days: 30

      - name: Fail on critical invariants
        if: steps.parse.outputs.critical_failures > 0
        run: |
          echo "DEPLOYMENT BLOCKED: ${{ steps.parse.outputs.critical_failures }} critical invariant(s) failed"
          exit 1
        shell: bash

      - name: Warn on non-critical failures
        if: steps.parse.outputs.failed > 0 && steps.parse.outputs.critical_failures == 0
        run: |
          echo "Warning: ${{ steps.parse.outputs.failed }} non-critical invariant(s) failed"
        shell: bash
