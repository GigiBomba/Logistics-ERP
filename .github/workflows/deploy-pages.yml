# Deploy the Operion website (website/) to Cloudflare Pages
#
# The frontend lives at `website/` in this monorepo. A push to `main` that
# touches website/ builds it and deploys dist/client to the Cloudflare Pages
# project. The production domain is https://operionerp.xyz (zone already in the
# Cloudflare account — it hosts api.operionerp.xyz).
#
# ONE-TIME MANUAL SETUP (required before this workflow can go green):
#   (1) Verify the Cloudflare Pages project exists (name: `operion-website`,
#       created 2026-08-01; as of 2026-08-06 no successful deployment has
#       landed — pages.dev returns 522). Dashboard: Workers & Pages, or
#       CLI: `npx wrangler pages project list`.
#   (2) GitHub repository SECRETS (Settings > Secrets and variables > Actions):
#         CLOUDFLARE_API_TOKEN  -> Cloudflare API token, "Cloudflare Pages: Edit" permission
#         CLOUDFLARE_ACCOUNT_ID -> Cloudflare account ID
#   (3) GitHub repository VARIABLE:
#         CLOUDFLARE_PAGES_PROJECT -> `operion-website`
#   (4) Custom domain: attach `operionerp.xyz` to the Pages project
#       (Pages > <project> > Custom domains) and point DNS
#       (CNAME operionerp.xyz -> <project>.pages.dev). Until then, successful
#       deploys are only reachable at <project>.pages.dev.
#
# Build notes:
#   - vike build outputs dist/client/ (prerendered pages + assets) — THAT is
#     the deploy root. Do not upload `dist/` (it has no index.html).
#   - globals.css is imported in pages/+Page.tsx so vike emits + links the CSS;
#     fonts are linked via headHtmlBegin in pages/+config.ts.

name: Deploy Website (Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` = tsc -b && sitemap && og-images && vike build
      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: website/dist/client
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
