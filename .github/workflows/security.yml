name: Security Test Suite

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt/PySide6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libasound2t64
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt PyJWT bcrypt httpx pytest pytest-xdist pytest-asyncio freezegun sqlalchemy

      - name: Secret scan (fast)
        run: |
          if git ls-files --error-unmatch admin.env 2>&1; then
            echo "❌ admin.env is tracked in git!"
            exit 1
          else
            echo "✅ No committed secrets found"
          fi

      - name: Run security tests
        run: python -m pytest tests/security/ -v --tb=short
        env:
          OPERION_JWT_SECRET_KEY: test-key-ci-32-chars-required-here!!
          OPERION_ENV: test
          OPERION_SUPPORT_INTERNAL_AUTH: test-key-support-32-chars-min!!
          OPERION_RATE_LIMIT: "100000"
          CI: true

      - name: pip-audit
        run: pip install pip-audit && pip-audit
        continue-on-error: true
