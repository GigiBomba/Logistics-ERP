name: Playwright E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    # The website/ app is being removed (WIP deletion); skip this job
    # entirely when the directory is no longer present in the repo so the
    # workflow never fails on a fresh checkout.
    if: hashFiles('website/package.json') != ''
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/test-results/
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: website/playwright-report/
          if-no-files-found: warn
