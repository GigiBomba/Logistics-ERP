name: Python Tests & Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
        include:
          # Shard: split Linux test run across two jobs per Python version
          - os: ubuntu-latest
            python-version: "3.10"
            shard: 1
            shard-count: 2
          - os: ubuntu-latest
            python-version: "3.10"
            shard: 2
            shard-count: 2
          - os: ubuntu-latest
            python-version: "3.11"
            shard: 1
            shard-count: 2
          - os: ubuntu-latest
            python-version: "3.11"
            shard: 2
            shard-count: 2
        exclude:
          # Remove base ubuntu entries (replaced by sharded versions above)
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt/PySide6 system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
        shell: bash

      - name: Start test infrastructure (Linux)
        if: runner.os == 'Linux'
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            PG_OK=$(docker compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U operion -d operion_test 2>/dev/null && echo "1" || echo "0")
            REDIS_OK=$(docker compose -f docker-compose.test.yml exec -T redis-test redis-cli ping 2>/dev/null && echo "1" || echo "0")
            if [ "$PG_OK" = "1" ] && [ "$REDIS_OK" = "1" ]; then
              echo "All services are ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
        shell: bash

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pytest-timeout pytest-xdist pytest-split coverage psycopg2-binary

      - name: Run tests with sharding (Linux, full suite)
        if: runner.os == 'Linux'
        run: |
          SHARD_ARGS=""
          if [ -n "${{ matrix.shard }}" ] && [ -n "${{ matrix.shard-count }}" ]; then
            SHARD_ARGS="--splits ${{ matrix.shard-count }} --group ${{ matrix.shard }}"
          fi
          coverage run --parallel-mode -m pytest -v --tb=short -n auto $SHARD_ARGS
        env:
          OPERION_DB_ENGINE: postgresql
          OPERION_TEST_POSTGRES_DSN: postgresql://operion:operion_test_ci@localhost:5432/operion_test
          OPERION_JWT_SECRET_KEY: test-key-ci-32-chars-required-here!!
          OPERION_ADMIN_EMAIL: admin@test.com
          OPERION_ADMIN_PASSWORD_HASH: ${{ secrets.OPERION_ADMIN_PASSWORD_HASH || '' }}
          OPERION_ENV: test
          OPERION_RATE_LIMIT: "100000"
          CI: true
        shell: bash

      - name: Run tests (Windows/macOS, skip DB-dependent)
        if: runner.os != 'Linux'
        run: |
          coverage run --parallel-mode -m pytest -v --tb=short -n auto -k "not integration and not e2e"
        env:
          OPERION_DB_ENGINE: sqlite
          OPERION_DB_PATH: data/test_ci.db
          OPERION_JWT_SECRET_KEY: test-key-ci-32-chars-required-here!!
          OPERION_ADMIN_EMAIL: admin@test.com
          OPERION_ADMIN_PASSWORD_HASH: ${{ secrets.OPERION_ADMIN_PASSWORD_HASH || '' }}
          OPERION_ENV: test
          OPERION_RATE_LIMIT: "100000"
          CI: true

      - name: Generate coverage report
        run: |
          coverage combine
          coverage report
          coverage json -o coverage.json
          coverage lcov -o coverage.lcov

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.os }}-${{ matrix.python-version }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: |
            coverage.json
            coverage.lcov
          if-no-files-found: warn

      - name: Coverage summary
        run: |
          echo "## ${{ matrix.os }} Python ${{ matrix.python-version }} coverage results" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
