name: Security Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM

jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tools
        run: |
          pip install pip-audit bandit safety

      # ── pip-audit ────────────────────────────────────────────────
      - name: pip-audit (dependency vulnerability scan)
        run: |
          # PYSEC-2022-252: deep-translator 1.11.4 — historical PyPI supply-chain
          # attack from 2022. The compromised package was removed from PyPI and
          # re-released clean. Current 1.11.4 and 1.2.0+ are safe. Advisory is stale.
          pip-audit --desc on --no-deps --ignore-vuln PYSEC-2022-252

      # ── Bandit (static analysis) ──────────────────────────────────
      - name: Bandit (SAST scan)
        run: |
          bandit -r . -x tests,node_modules,.venv,__pycache__ -f custom -o bandit-report.txt || true
          cat bandit-report.txt
        continue-on-error: true

      # ── npm audit (Node.js dependencies) ─────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (Node.js dependency scan)
        run: |
          cd ui
          npm install --package-lock-only
          npm audit --audit-level=moderate
        continue-on-error: true

      # ── Run tests ────────────────────────────────────────────────
      - name: Run tests
        run: |
          python -m pytest tests/ -x -q --timeout=60 2>&1 || true

      # ── Secrets check ────────────────────────────────────────────
      - name: Check for committed secrets
        run: |
          # Check if any .env files are tracked
          TRACKED_ENV=$(git ls-files '*.env' '*.env.*' | grep -v '.example' | grep -v '.gitignore')
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ WARNING: Tracked .env files found:"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "✅ No .env files tracked in git"

      - name: Summary
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Security Check Complete"
          echo "  Python: ${{ matrix.python-version }}"
          echo "  Branch: ${{ github.ref }}"
          echo "══════════════════════════════════════════════════"
