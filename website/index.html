<!doctype html>
<html lang="en" class="light" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon / PWA manifest -->
    <link rel="icon" type="image/png" sizes="16x16" href="/logo3.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo3.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo3.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary meta -->
    <title>Operion — Logistics Operations System</title>
    <meta name="description" content="Operion is a logistics operations system — route planning, fleet management, dispatch, and document generation in one platform. Built for transport companies." />
    <meta name="keywords" content="logistics ERP, transport management software, fleet management, route planner, dispatch software, trucking software, trip calculator, logistics automation" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts: Inter (sans) + JetBrains Mono (mono).
         Self-hosted woff2 files (public/fonts/, font-display=swap).
         Generated by scripts/fetch-fonts.mjs. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://operionerp.xyz" />

    <!-- Open Graph -->
    <meta property="og:title" content="Operion — Logistics Operations System" />
    <meta property="og:description" content="Logistics operations system — route planning, fleet management, dispatch, and document generation for transport companies." />
    <meta property="og:image" content="https://operionerp.xyz/logo3.png" />
    <meta property="og:url" content="https://operionerp.xyz" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Operion" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@operion" />
    <meta name="twitter:title" content="Operion — Logistics Operations System" />
    <meta name="twitter:description" content="Logistics operations system — route planning, fleet management, and dispatch." />
    <meta name="twitter:image" content="https://operionerp.xyz/logo3.png" />

    <!-- Structured Data — Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Operion",
        "url": "https://operionerp.xyz",
        "logo": "https://operionerp.xyz/logo3.png",
        "description": "Operion is a logistics operations system — route planning, fleet management, dispatch, and document generation.",
        "email": "operion.contact@gmail.com",
        "foundingDate": "2026-04",
        "sameAs": [
          "https://twitter.com/operion",
          "https://github.com/operion",
          "https://linkedin.com/company/operion"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+40-123-456-789",
          "contactType": "customer service",
          "email": "operion.contact@gmail.com"
        }
      }
    </script>

    <!-- Structured Data — SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Operion",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Windows 10, Windows 11",
        "description": "Desktop logistics management application for trip profit calculation, route planning, fleet management, dispatch, CMR document generation, and analytics.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR",
          "description": "Free during development phase"
        },
        "softwareVersion": "0.1.0",
        "datePublished": "2026-04",
        "featureList": [
          "Trip Profit Calculator",
          "Route Planning",
          "Fleet Management",
          "Driver Management",
          "Dispatch Board",
          "CMR Document Generation",
          "Invoice Generation",
          "Analytics Dashboard"
        ]
      }
    </script>

    <!-- Structured Data — WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Operion",
        "url": "https://operionerp.xyz",
        "description": "Logistics operations system for transport companies"
      }
    </script>

    <!-- Google Analytics (conditional on VITE_GA_MEASUREMENT_ID) -->
    <script>
      var gaMeasurementId = "%VITE_GA_MEASUREMENT_ID%";
      if (gaMeasurementId && gaMeasurementId.indexOf("VITE_GA") === -1) {
        window.dataLayer = window.dataLayer || [];
        function gtag(){window.dataLayer.push(arguments);}
        // GCMv2: default ALL signals to denied BEFORE tags fire
        gtag('consent', 'default', {
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'analytics_storage': 'denied',
          'wait_for_update': 500
        });
        gtag('set', 'ads_data_redaction', true);
        gtag('set', 'url_passthrough', true);
        gtag("js", new Date());
        gtag("config", gaMeasurementId);

        (function() {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + gaMeasurementId;
          document.head.appendChild(s);
        })();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
