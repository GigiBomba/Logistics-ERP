repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key

  # ── Constitutional Governance Hooks ─────────────────────────────
  - repo: local
    hooks:
      - id: no-hardcoded-secrets
        name: G-01 — No Hardcoded Secrets
        entry: python scripts/ci_copilot_gates.py
        language: python
        files: ^backend/copilot/
        pass_filenames: false
        description: "Scans for hardcoded secrets, API keys, and passwords"
        stages: [pre-commit, pre-push]

      - id: ruff-constitutional
        name: Constitutional — Ruff Lint
        entry: ruff check --fix
        language: system
        files: \.py$
        types: [python]
        stages: [pre-commit]

      - id: ruff-format-constitutional
        name: Constitutional — Ruff Format
        entry: ruff format
        language: system
        files: \.py$
        types: [python]
        stages: [pre-commit]

  # ── UI Style Gate (Phase 1 Lane C) ───────────────────────────────
  # Repo-wide static gate over ui/: inline QSS, raw hex colors,
  # sub-10px fonts (baseline-graded) + fixed-geometry warnings.
  # Runs once per commit regardless of which files changed.
  - repo: local
    hooks:
      - id: ui-style-gate
        name: UI Style Gate — Phase 1 Lane C
        entry: python tools/ui_style_gate.py
        language: system
        pass_filenames: false
        description: "Static style gate over ui/ (inline QSS, raw hex colors, sub-10px fonts, fixed-geometry warnings)"
        stages: [pre-commit]
