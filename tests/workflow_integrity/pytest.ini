# Workflow Integrity suite pytest config (self-documenting only).
#
# This file registers the suite markers and deliberately carries NO addopts.
#
# Config-discovery note: running `pytest tests/workflow_integrity` (or any path
# under it) directly from the repo root makes THIS file the rootdir configfile —
# pytest finds the nearest pytest.ini before the root pyproject.toml — which
# drops the root [tool.pytest.ini_options] addopts (`--strict-markers --tb=short
# -q -n 2 --dist=loadscope`).  Direct runs are still safe because
# tests/workflow_integrity/conftest.py re-exports the root
# `tests.conftest.reset_singletons` autouse fixture (singletons are reset per
# test, so non-parallel runs do not leak state).  For CI-identical behavior
# (xdist -n 2 --dist=loadscope, strict markers, short tracebacks) always run
# from the repo root so the root [tool.pytest.ini_options] governs; the root
# pyproject marker list is authoritative and mirrored here.
#
# To force THIS file as the active config from anywhere, use:
#     pytest -c tests/workflow_integrity/pytest.ini

[pytest]
minversion = 8.4
markers =
    slow: Marks tests as slow (deselect with '-m "not slow"')
    workflow_integrity: Workflow integrity test
    golden_flow: Golden-path workflow test
    friction: Friction rule violation test
    financial_invariant: Financial invariant assertion test
    state_machine: State machine transition test
    parity: Cross-platform parity test
    argo: ARGO autonomy workflow test
    chaos_workflow: Chaos / resilience workflow test
    telemetry: Telemetry assertion test
    historical: Historical data immutability test
    scale: Scale validation against a synthetic 10,000-trip dataset (blueprint Phase 6.2; never runs in the default suite)
