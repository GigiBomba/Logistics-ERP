# Local Docker deployment — runs the FastAPI backend with SQLite.
# Cloudflare Tunnel (already running as a Windows service) forwards
# api.operionerp.xyz → localhost:8000 → this container.
#
# Usage:
#   docker compose -f compose.local.yaml up -d --build
#   docker compose -f compose.local.yaml logs -f
#   docker compose -f compose.local.yaml down

services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile.api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist SQLite database on the host so data survives container restarts
      - ./data:/app/data
      # Mount .env so main.py can load_dotenv() without Docker Compose corrupting $ in bcrypt hashes
      - ./.env:/app/.env:ro
    environment:
      - OPERION_ENV=development
      # Run the OperationsEngine workers server-side (remote-mode parity):
      # the desktop starts no ops engine in remote mode, so the API process
      # runs OperationsEngine(db, prefs).start() against its own database.
      - OPERION_RUN_OPS_ENGINE=1
      # CRITICAL: the server must NEVER share the desktop's SQLite file
      # (data/cashflow.db). Two SQLite engines (Windows desktop + Linux
      # container) migrating the same file concurrently corrupts its schema
      # ("malformed database schema ... index already exists") and breaks
      # /sync/pull + /sync/sequences with 500s. The server gets its own DB;
      # the desktop syncs to it via the API.
      - OPERION_DB_PATH=/app/data/server.db
    restart: unless-stopped
