[project]
name = "operion-erp"
version = "1.0.0"
description = "Logistics ERP — calculator, route planner, fleet manager, CMR/eFTI generator"
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "coverage>=7.0",
    "ruff>=0.12",
    "pre-commit>=4.0",
]

# ──────────────────────────────────────────────────────────────
# Ruff — fast Python linter + formatter (replaces flake8, isort, pyflakes, pycodestyle)
# Run: ruff check .        (lint)
# Run: ruff check --fix .  (auto-fix)
# Run: ruff format .       (format)
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "tools/tachograph",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "N818",   # exception class names should end with Error
]
per-file-ignores = {}

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 1
known-first-party = ["config", "database", "repositories", "services", "ui", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--tb=short", "-q"]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:pytestqt.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "qt: Qt widget tests",
]

# ──────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
