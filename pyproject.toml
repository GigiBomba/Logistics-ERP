[project]
name = "operion-erp"
version = "1.0.0"
description = "Logistics ERP — calculator, route planner, fleet manager, CMR/eFTI generator"
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "coverage>=7.0",
    "ruff>=0.12",
    "pre-commit>=4.0",
]
sharing = [
    "qrcode>=8.0.0",
    "qrcode[pil]>=8.0.0",
]

# ──────────────────────────────────────────────────────────────
# Ruff — fast Python linter + formatter (replaces flake8, isort, pyflakes, pycodestyle)
# Run: ruff check .        (lint)
# Run: ruff check --fix .  (auto-fix)
# Run: ruff format .       (format)
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "tools/tachograph",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "N818",   # exception class names should end with Error
    "N802",   # Qt method names (enterEvent, closeEvent etc.) must match C++ override
    "N806",   # Qt/CV variable naming conventions
    "N815",   # Qt signal names use mixedCase
    "N813",   # camelcase import alias
    "E701",   # compound statements (if cond: action) – intentional brevity
    "E702",   # compound statements (a; b) – intentional brevity
    "E402",   # module-level import not at top – deferred imports for perf
    "RUF002", # ambiguous unicode in docstrings – intentional × signs etc.
    "RUF003", # ambiguous unicode in comments – intentional en dashes
    "RUF012", # mutable class defaults – Qt class constants pattern
    "SIM102", # collapsible if – readability preference
]
per-file-ignores = {"backend/*" = ["UP006", "UP035"], "client/*" = ["UP006", "UP035", "UP045"], "services/*" = ["UP006", "UP035", "UP045"], "repositories/*" = ["UP006", "UP035"], "database/*" = ["UP006", "UP035", "SIM105", "SIM115"], "ui/*" = ["UP045", "UP006", "UP035"], "scripts/*" = ["UP006", "UP035"]}

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 1
known-first-party = ["backend", "client", "config", "database", "repositories", "services", "ui", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--tb=short", "-q"]
filterwarnings = [
    "ignore::DeprecationWarning:pytestqt.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "qt: Qt widget tests",
    "e2e: end-to-end integration tests",
    "mutation: mutation-killing boundary tests",
    "loadtest: load and performance tests",
    "stresstest: system stress tests",
    "chaos: chaos and resilience tests",
    "concurrency: thread-safety and race-condition tests",
]

# ──────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
