[project]
name = "operion-erp"
version = "1.0.0"
description = "Logistics ERP — calculator, route planner, fleet manager, CMR/eFTI generator"
dependencies = [
    "alembic>=1.13",
]
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    "coverage>=7.0",
    "ruff>=0.12",
    "pre-commit>=4.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]
sharing = [
    "qrcode>=8.0.0",
    "qrcode[pil]>=8.0.0",
]

# ──────────────────────────────────────────────────────────────
# Ruff — fast Python linter + formatter (replaces flake8, isort, pyflakes, pycodestyle)
# Run: ruff check .        (lint)
# Run: ruff check --fix .  (auto-fix)
# Run: ruff format .       (format)
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "tools/tachograph",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "N818",   # exception class names should end with Error
    "N802",   # Qt method names (enterEvent, closeEvent etc.) must match C++ override
    "N806",   # Qt/CV variable naming conventions
    "N815",   # Qt signal names use mixedCase
    "N813",   # camelcase import alias
    "E701",   # compound statements (if cond: action) – intentional brevity
    "E702",   # compound statements (a; b) – intentional brevity
    "E402",   # module-level import not at top – deferred imports for perf
    "RUF002", # ambiguous unicode in docstrings – intentional × signs etc.
    "RUF003", # ambiguous unicode in comments – intentional en dashes
    "RUF012", # mutable class defaults – Qt class constants pattern
    "SIM102", # collapsible if – readability preference
]
per-file-ignores = {"backend/*" = ["UP006", "UP035"], "client/*" = ["UP006", "UP035", "UP045"], "services/*" = ["UP006", "UP035", "UP045"], "repositories/*" = ["UP006", "UP035"], "database/*" = ["UP006", "UP035", "SIM105", "SIM115"], "ui/*" = ["UP045", "UP006", "UP035"], "scripts/*" = ["UP006", "UP035"]}

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 1
known-first-party = ["backend", "client", "config", "database", "repositories", "services", "ui", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--tb=short", "-q", "-n", "auto"]
filterwarnings = [
    "ignore::DeprecationWarning:pytestqt.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "qt: Qt widget tests",
    "e2e: end-to-end integration tests",
    "integration: integration tests wiring real services with test DB",
    "mutation: mutation-killing boundary tests",
    "loadtest: load and performance tests",
    "stresstest: system stress tests",
    "chaos: chaos and resilience tests",
    "concurrency: thread-safety and race-condition tests",
    "asyncio: async/await tests",
    "postgresql: tests that require a running PostgreSQL instance",
    "visual: visual regression / screenshot comparison tests",
    "visual_slow: visual tests that take >2 seconds",
]

# ──────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────
[tool.coverage.run]
# Source narrowed to the core packages (D8 baseline, 2026-08): source = ["."]
# swept scratch scripts and, with pytest-xdist, produced "No source for code:
# pyscript" in CI. parallel = true makes `coverage run -m pytest -n auto`
# actually measure the xdist worker processes.
source = ["services", "repositories", "client", "backend"]
parallel = true
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
    "*/migrations/*",
    ".venv/*",
    "venv/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
# Evidence-based fail_under (roadmap 11): full-suite baseline established by
# D8 (2026-08) measures 76% aggregate over services/repositories/client/backend
# (A∪B∪C∪D chunks, parallel-mode + combine; see .slim/deepwork progress file).
# fail_under stays at 65 — a calibrated-but-conservative gate: run-to-run
# variance (~±4pt), ~30 pre-existing failing tests, and erratic e2e/mobile
# coverage argue against raising until those failures are green. CI must run
# with parallel mode + `coverage combine` for the number to be enforceable.
fail_under = 65
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
