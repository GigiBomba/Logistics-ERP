version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: operion
      POSTGRES_USER: operion
      POSTGRES_PASSWORD: ${OPERION_POSTGRES_PASSWORD:-operion_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operion -d operion"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      OPERION_DB_ENGINE: postgresql
      OPERION_POSTGRES_DSN: postgresql://operion:${OPERION_POSTGRES_PASSWORD:-operion_secret}@db:5432/operion
      OPERION_REDIS_URL: redis://redis:6379/0
      OPERION_CELERY_BROKER: redis://redis:6379/1
      OPERION_CELERY_RESULT: redis://redis:6379/2
      OPERION_API_HOST: 0.0.0.0
      OPERION_API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_reports:/app/reports

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      OPERION_DB_ENGINE: postgresql
      OPERION_POSTGRES_DSN: postgresql://operion:${OPERION_POSTGRES_PASSWORD:-operion_secret}@db:5432/operion
      OPERION_REDIS_URL: redis://redis:6379/0
      OPERION_CELERY_BROKER: redis://redis:6379/1
      OPERION_CELERY_RESULT: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_reports:/app/reports

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: celery -A backend.celery_app.celery beat --loglevel=info
    environment:
      OPERION_DB_ENGINE: postgresql
      OPERION_POSTGRES_DSN: postgresql://operion:${OPERION_POSTGRES_PASSWORD:-operion_secret}@db:5432/operion
      OPERION_REDIS_URL: redis://redis:6379/0
      OPERION_CELERY_BROKER: redis://redis:6379/1
      OPERION_CELERY_RESULT: redis://redis:6379/2
    depends_on:
      - redis

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  app_data:
  app_logs:
  app_reports:
